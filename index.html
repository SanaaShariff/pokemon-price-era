<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Sealed Price Tracker</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d0f1a;
      --surface:      #13151f;
      --surface-2:    #1a1d2e;
      --border:       #252838;
      --text:         #e2e8f0;
      --muted:        #64748b;
      --accent:       #818cf8;
      --accent-dim:   rgba(129,140,248,0.12);
      --green:        #4ade80;
      --green-dim:    rgba(74,222,128,0.12);
      --red:          #f87171;
      --red-dim:      rgba(248,113,113,0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    header h1 span { color: var(--accent); }

    /* ── Era tabs ── */
    .era-tabs {
      display: flex;
      padding: 0 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 14px 22px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Hot banner ── */
    .hot-section {
      padding: 18px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .hot-items {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hot-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      flex: 1;
      min-width: 210px;
    }
    .hot-info { flex: 1; min-width: 0; }
    .hot-product {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hot-set { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .hot-price { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .badge {
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.up   { background: var(--green-dim); color: var(--green); }
    .badge.down { background: var(--red-dim);   color: var(--red);   }
    .badge.flat { background: var(--surface);   color: var(--muted); }

    /* ── Main grid area ── */
    main { padding: 24px 32px 40px; }

    .set-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    /* ── Set card ── */
    .set-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s, box-shadow .15s;
      user-select: none;
    }
    .set-card:hover { border-color: var(--accent); background: var(--surface-2); }
    .set-card.active {
      border-color: var(--accent);
      background: var(--surface-2);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    .abbrev-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .abbrev-pill {
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .card-date {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    .card-set-name {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }
    .price-rows { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .price-row  { display: flex; justify-content: space-between; align-items: center; }
    .pr-label   { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .pr-val     { font-size: 14px; font-weight: 700; }
    .sparkline  { display: block; width: 100%; }

    /* ── Detail panel ── */
    .detail-panel {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 24px;
      display: none;
    }
    .detail-panel.open { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .detail-title { font-size: 17px; font-weight: 700; }
    .close-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      transition: color .15s, border-color .15s;
    }
    .close-btn:hover { color: var(--text); border-color: var(--muted); }

    .price-cards-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .price-card {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      text-align: center;
      transition: border-color .15s, background .15s;
    }
    .price-card:hover { border-color: var(--accent); }
    .price-card.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .pc-type   { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .pc-price  { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .pc-change { font-size: 13px; font-weight: 600; }
    .pc-change.up   { color: var(--green); }
    .pc-change.down { color: var(--red);   }
    .pc-change.flat { color: var(--muted); }

    .chart-container { height: 300px; }

    /* ── Loading / empty ── */
    .state-msg {
      color: var(--muted);
      text-align: center;
      padding: 48px 0;
      font-size: 14px;
    }
    .inline-msg { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

<header>
  <h1>Pokemon <span>Sealed</span> Price Tracker</h1>
</header>

<nav class="era-tabs">
  <button class="tab active" data-era="Sword &amp; Shield">Sword &amp; Shield</button>
  <button class="tab" data-era="Scarlet &amp; Violet">Scarlet &amp; Violet</button>
  <button class="tab" data-era="Mega Evolution">Mega Evolution</button>
</nav>

<section class="hot-section" id="hot-section">
  <div class="section-label" id="hot-title">🔥 Hot This Week</div>
  <div id="hot-items" class="hot-items">
    <div class="inline-msg">Loading movers...</div>
  </div>
</section>

<main>
  <div id="set-grid" class="set-grid">
    <div class="state-msg">Loading sets...</div>
  </div>
  <div id="detail-panel" class="detail-panel"></div>
</main>

<script>
  /* ── State ── */
  let currentEra = 'Sword & Shield';
  const eraCache = {};
  const historyCache = {};
  let selectedSet = null;
  let selectedType = 'Elite Trainer Box';
  let renderToken = 0;

  const TYPES = [
    { db: 'Elite Trainer Box', label: 'Elite Trainer Box', short: 'ETB'  },
    { db: 'Booster Box',       label: 'Booster Box',       short: 'Box'  },
    { db: 'Booster Pack',      label: 'Single Pack',        short: 'Pack' },
  ];

  /* ── Boot ── */
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.tab').forEach(tab =>
      tab.addEventListener('click', () => switchEra(tab.dataset.era))
    );
    loadHot(currentEra);
    loadEra('Sword & Shield');
  });

  /* ── Era switching ── */
  async function switchEra(era) {
    if (era === currentEra && eraCache[era]) return;
    currentEra = era;
    selectedSet = null;
    closeDetail();

    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('active', t.dataset.era === era)
    );

    loadHot(era);

    if (eraCache[era]) {
      renderGrid(eraCache[era]);
      loadSparklines(eraCache[era]);
      return;
    }

    document.getElementById('set-grid').innerHTML =
      '<div class="state-msg">Loading sets...</div>';

    try {
      const data = await apiFetch(`/api/era/${encodeURIComponent(era)}`);
      eraCache[era] = data;
      renderGrid(data);
      loadSparklines(data);
    } catch (e) {
      document.getElementById('set-grid').innerHTML =
        '<div class="state-msg">Failed to load sets.</div>';
    }
  }

  function loadEra(era) { switchEra(era); }

  /* ── Hot banner ── */
  async function loadHot(era) {
    const el      = document.getElementById('hot-items');
    const section = document.getElementById('hot-section');
    const title   = document.getElementById('hot-title');
    el.innerHTML  = '<div class="inline-msg">Loading movers...</div>';
    section.style.display = '';

    try {
      const { mode, items } = await apiFetch(`/api/hot?era=${encodeURIComponent(era)}`);

      if (mode === 'empty') {
        section.style.display = 'none';
        return;
      }

      if (mode === 'movers') {
        title.textContent = '🔥 Hot This Week';
        el.innerHTML = items.map(item => {
          const chg  = item.pct_change;
          const cls  = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
          const sign = chg > 0 ? '+' : '';
          return `
            <div class="hot-item">
              <div class="hot-info">
                <div class="hot-product">${item.product_name}</div>
                <div class="hot-set">${item.abbreviation}</div>
              </div>
              <div class="hot-price">$${item.current_price.toFixed(2)}</div>
              <div class="badge ${cls}">${sign}${chg.toFixed(1)}%</div>
            </div>`;
        }).join('');
      } else {
        title.textContent = '💎 Most Valuable This Week';
        el.innerHTML = items.map(item => `
          <div class="hot-item">
            <div class="hot-info">
              <div class="hot-product">${item.product_name}</div>
              <div class="hot-set">${item.abbreviation}</div>
            </div>
            <div class="hot-price">$${item.current_price.toFixed(2)}</div>
          </div>`).join('');
      }
    } catch (e) {
      el.innerHTML = '<div class="inline-msg">Could not load movers.</div>';
    }
  }

  /* ── Set grid ── */
  function renderGrid(sets) {
    const grid = document.getElementById('set-grid');
    if (!sets.length) {
      grid.innerHTML = '<div class="state-msg">No sets found.</div>';
      return;
    }
    grid.innerHTML = sets.map(set => {
      const etb  = byType(set.products, 'Elite Trainer Box');
      const bb   = byType(set.products, 'Booster Box');
      const etbPrice = etb?.latest?.market_price;
      const bbPrice  = bb?.latest?.market_price;

      return `
        <div class="set-card ${selectedSet?.group_id === set.group_id ? 'active' : ''}"
             onclick="selectSet(${set.group_id})">
          <div class="card-header">
            <div class="abbrev-col">
              <span class="abbrev-pill">${set.abbreviation}</span>
              <span class="card-date">${formatDate(set.published_on)}</span>
            </div>
            <span class="card-set-name">${cleanName(set.name)}</span>
          </div>
          <div class="price-rows">
            <div class="price-row">
              <span class="pr-label">ETB</span>
              <span class="pr-val">${fmtPrice(etbPrice)}</span>
            </div>
            <div class="price-row">
              <span class="pr-label">Box</span>
              <span class="pr-val">${fmtPrice(bbPrice)}</span>
            </div>
          </div>
          <div id="spark-${set.group_id}">${sparkline([])}</div>
        </div>`;
    }).join('');
  }

  /* ── Sparkline async loader ── */
  async function loadSparklines(sets) {
    await Promise.allSettled(sets.map(async set => {
      const etb = byType(set.products, 'Elite Trainer Box');
      if (!etb) return;
      const pid = etb.product_id;
      try {
        if (!historyCache[pid]) {
          historyCache[pid] = await apiFetch(`/api/history/${pid}`);
        }
        const el = document.getElementById(`spark-${set.group_id}`);
        if (el) el.innerHTML = sparkline(historyCache[pid]);
      } catch { /* leave placeholder dashed line */ }
    }));
  }

  /* ── Set card click ── */
  function selectSet(groupId) {
    const sets = eraCache[currentEra] ?? [];
    const set = sets.find(s => s.group_id === groupId);
    if (!set) return;

    if (selectedSet?.group_id === groupId) {
      selectedSet = null;
      closeDetail();
      rerenderCards();
      return;
    }

    selectedSet = set;
    selectedType = 'Elite Trainer Box';
    rerenderCards();
    openDetail(set);
  }

  function rerenderCards() {
    document.querySelectorAll('.set-card').forEach(card => {
      const gid = parseInt(card.querySelector('[onclick]')?.getAttribute('onclick')?.match(/\d+/) ?? ['0']);
    });
    // Re-render grid to refresh active state without full fetch
    const sets = eraCache[currentEra] ?? [];
    renderGrid(sets);
  }

  /* ── Detail panel ── */
  function openDetail(set) {
    const panel = document.getElementById('detail-panel');
    panel.classList.add('open');
    panel.innerHTML = buildDetailHTML(set);
    renderChart(set, selectedType);
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }

  function closeDetail() {
    const panel = document.getElementById('detail-panel');
    panel.classList.remove('open');
    panel.innerHTML = '';
    ++renderToken;
  }

  function buildDetailHTML(set) {
    const cards = TYPES.map(t => {
      const product = byType(set.products, t.db);
      const price   = product?.latest?.market_price;
      const chg     = pctChange(product?.history ?? []);
      const cls     = chg === null ? 'flat' : chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
      const chgStr  = chg === null ? '—' : `${chg > 0 ? '+' : ''}${chg.toFixed(1)}%`;

      return `
        <div class="price-card ${selectedType === t.db ? 'selected' : ''}"
             onclick="switchType('${t.db}')">
          <div class="pc-type">${t.label}</div>
          <div class="pc-price">${fmtPrice(price)}</div>
          <div class="pc-change ${cls}">${chgStr}</div>
        </div>`;
    }).join('');

    return `
      <div class="detail-header">
        <span class="detail-title">${set.name}</span>
        <button class="close-btn" onclick="closeDetailClick()">✕</button>
      </div>
      <div class="price-cards-row">${cards}</div>
      <div class="chart-container" id="price-chart"></div>`;
  }

  function closeDetailClick() {
    selectedSet = null;
    closeDetail();
    const sets = eraCache[currentEra] ?? [];
    renderGrid(sets);
  }

  async function switchType(dbType) {
    if (!selectedSet) return;
    selectedType = dbType;

    document.querySelectorAll('.price-card').forEach(c => {
      const onclick = c.getAttribute('onclick') ?? '';
      c.classList.toggle('selected', onclick.includes(`'${dbType}'`));
    });

    await renderChart(selectedSet, dbType);
  }

  /* ── Plotly chart ── */
  async function renderChart(set, dbType) {
    const token = ++renderToken;
    const chartEl = document.getElementById('price-chart');
    if (!chartEl) return;

    const product = byType(set.products, dbType);
    if (!product) {
      chartEl.innerHTML =
        '<div class="state-msg" style="padding:60px 0">No data for this product type.</div>';
      return;
    }

    const pid = product.product_id;
    if (!historyCache[pid]) {
      chartEl.innerHTML =
        '<div class="state-msg" style="padding:60px 0">Loading chart...</div>';
      try {
        historyCache[pid] = await apiFetch(`/api/history/${pid}`);
      } catch {
        if (token !== renderToken) return;
        chartEl.innerHTML =
          '<div class="state-msg" style="padding:60px 0">Failed to load chart data.</div>';
        return;
      }
    }

    if (token !== renderToken) return;

    const history = historyCache[pid];
    const dates   = history.map(h => h.captured_at);
    const prices  = history.map(h => h.market_price);

    chartEl.innerHTML = '';

    Plotly.newPlot(chartEl, [{
      x: dates,
      y: prices,
      type: 'scatter',
      mode: 'lines+markers',
      line:   { color: '#818cf8', width: 2.5 },
      marker: { color: '#818cf8', size: 7 },
      fill: 'tozeroy',
      fillcolor: 'rgba(129,140,248,0.07)',
      hovertemplate: '<b>%{x}</b><br>$%{y:.2f}<extra></extra>',
    }], {
      paper_bgcolor: 'transparent',
      plot_bgcolor:  'transparent',
      font: { color: '#94a3b8', family: 'inherit', size: 12 },
      xaxis: {
        gridcolor: '#252838',
        linecolor: '#252838',
        tickcolor: '#252838',
        zeroline:  false,
      },
      yaxis: {
        gridcolor:  '#252838',
        linecolor:  '#252838',
        tickcolor:  '#252838',
        tickprefix: '$',
        zeroline:   false,
      },
      margin: { t: 12, r: 16, b: 48, l: 64 },
      showlegend: false,
    }, {
      responsive:     true,
      displayModeBar: false,
    });
  }

  /* ── Sparkline (SVG) ── */
  function sparkline(history) {
    const W = 160, H = 40, pad = 4;
    const prices = history.map(h => h.market_price).filter(p => p != null);

    if (prices.length < 2) {
      return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}"
              stroke="var(--border)" stroke-width="1" stroke-dasharray="4"/>
      </svg>`;
    }

    const lo = Math.min(...prices), hi = Math.max(...prices);
    const range = hi - lo || 1;
    const pts = prices.map((p, i) => {
      const x = pad + (i / (prices.length - 1)) * (W - 2 * pad);
      const y = H - pad - ((p - lo) / range) * (H - 2 * pad);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const color = prices[prices.length - 1] >= prices[0] ? 'var(--green)' : 'var(--red)';
    return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none"
                stroke="${color}" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  /* ── Helpers ── */
  function byType(products, dbType) {
    return products?.find(p => p.product_type === dbType) ?? null;
  }

  function pctChange(history) {
    const prices = history.map(h => h.market_price).filter(p => p != null);
    if (prices.length < 2) return null;
    const prev = prices[prices.length - 2];
    const cur  = prices[prices.length - 1];
    return prev ? ((cur - prev) / prev) * 100 : null;
  }

  function fmtPrice(val) {
    return val != null ? `$${val.toFixed(2)}` : '—';
  }

  function cleanName(name) {
    return name.replace(/^[A-Z0-9]+:\s*/, '');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [year, month] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(month, 10) - 1]} ${year}`;
  }

  async function apiFetch(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
</script>
</body>
</html>
