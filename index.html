<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TandemDex — Sealed Price Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0f;
      --surface:     #13131a;
      --surface-2:   #1c1c26;
      --border:      rgba(255,255,255,0.06);
      --border-hi:   rgba(255,255,255,0.13);
      --text:        #f0f0f0;
      --text-2:      #888899;
      --text-3:      #555566;
      --accent:      #6c63ff;
      --accent-dim:  rgba(108,99,255,0.13);
      --accent-glow: rgba(108,99,255,0.22);
      --green:       #00c896;
      --green-dim:   rgba(0,200,150,0.12);
      --red:         #ff4d6d;
      --red-dim:     rgba(255,77,109,0.12);
      --mono:        'Space Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-icon { display: block; flex-shrink: 0; }
    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(130deg, #6c63ff 0%, #4db8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .logo-sub {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 400;
    }

    /* ── Era tabs ── */
    .era-tabs {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tabs-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
    }
    .tab {
      padding: 13px 20px;
      border: none;
      background: none;
      color: var(--text-3);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab:hover { color: var(--text-2); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 2px; }

    /* ── Page content wrapper ── */
    .page-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ── Hot banner ── */
    .hot-section {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .hot-inner {
      border-left: 3px solid rgba(255, 165, 0, 0.5);
      padding-left: 16px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-3);
      margin-bottom: 12px;
    }
    .hot-items {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hot-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      flex: 1;
      min-width: 200px;
    }
    .hot-info { flex: 1; min-width: 0; }
    .hot-product {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .hot-set { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .hot-price {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      white-space: nowrap;
    }
    .badge.up   { background: var(--green-dim); color: var(--green); }
    .badge.down { background: var(--red-dim);   color: var(--red);   }
    .badge.flat { color: var(--text-3); }

    /* ── Set grid ── */
    main { padding: 24px 0 40px; }

    .set-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    /* ── Set card ── */
    .set-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s;
      user-select: none;
    }
    .set-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      border-color: var(--border-hi);
    }
    .set-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 24px var(--accent-glow);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .abbrev-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .abbrev-pill {
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .card-date {
      font-size: 10px;
      color: var(--text-3);
      white-space: nowrap;
    }
    .card-set-name {
      font-size: 12px;
      color: var(--text-2);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      line-height: 1.4;
    }
    .price-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .price-row  { display: flex; justify-content: space-between; align-items: center; }
    .pr-label   { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
    .pr-val     { font-family: var(--mono); font-size: 13px; color: var(--text); }
    .sparkline  { display: block; width: 100%; }

    /* ── Detail panel ── */
    .detail-panel {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 24px;
      display: none;
    }
    .detail-panel.open { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .detail-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .close-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-3);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .close-btn:hover { color: var(--text); border-color: var(--border-hi); }
    .close-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .price-cards-row { display: flex; gap: 12px; margin-bottom: 20px; }
    .price-card {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .price-card:hover { border-color: var(--border-hi); }
    .price-card.selected { border-color: var(--accent); background: var(--accent-dim); }

    .pc-type   { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .pc-price  { font-family: var(--mono); font-size: 24px; color: var(--text); margin-bottom: 8px; }
    .pc-change { font-family: var(--mono); font-size: 12px; }
    .pc-change.up   { color: var(--green); }
    .pc-change.down { color: var(--red);   }
    .pc-change.flat { color: var(--text-3); }

    .chart-container { height: 300px; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 24px 32px;
    }
    .footer-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .footer-logo { font-size: 16px; }
    .footer-copy { font-size: 11px; color: var(--text-3); }
    .footer-nav {
      display: flex;
      gap: 24px;
    }
    .footer-nav a {
      font-size: 12px;
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-nav a:hover { color: var(--text-2); }
    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 11px;
      color: var(--text-3);
      text-align: right;
    }
    .footer-email {
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-email:hover { color: var(--text-2); }

    /* ── Loading / empty states ── */
    .state-msg  { color: var(--text-3); text-align: center; padding: 48px 0; font-size: 13px; }
    .inline-msg { color: var(--text-3); font-size: 13px; }
  </style>
</head>

<script>
  /* ── State ── */
  let currentEra = 'Sword & Shield';
  const eraCache = {};
  const historyCache = {};
  let selectedSet = null;
  let selectedType = 'Elite Trainer Box';
  let renderToken = 0;

  const TYPES = [
    { db: 'Elite Trainer Box', label: 'Elite Trainer Box', short: 'ETB'  },
    { db: 'Booster Box',       label: 'Booster Box',       short: 'Box'  },
    { db: 'Booster Pack',      label: 'Single Pack',        short: 'Pack' },
  ];

  /* ── Boot ── */
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.tab').forEach(tab =>
      tab.addEventListener('click', () => switchEra(tab.dataset.era))
    );
    loadHot(currentEra);
    loadEra('Sword & Shield');
  });

  /* ── Era switching ── */
  async function switchEra(era) {
    if (era === currentEra && eraCache[era]) return;
    currentEra = era;
    selectedSet = null;
    closeDetail();

    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('active', t.dataset.era === era)
    );

    loadHot(era);

    if (eraCache[era]) {
      renderGrid(eraCache[era]);
      loadSparklines(eraCache[era]);
      return;
    }

    document.getElementById('set-grid').innerHTML =
      '<div class="state-msg">Loading sets...</div>';

    try {
      const data = await apiFetch(`/api/era/${encodeURIComponent(era)}`);
      eraCache[era] = data;
      renderGrid(data);
      loadSparklines(data);
    } catch (e) {
      document.getElementById('set-grid').innerHTML =
        '<div class="state-msg">Failed to load sets.</div>';
    }
  }

  function loadEra(era) { switchEra(era); }

  /* ── Hot banner ── */
  async function loadHot(era) {
    const el      = document.getElementById('hot-items');
    const section = document.getElementById('hot-section');
    const title   = document.getElementById('hot-title');
    el.innerHTML  = '<div class="inline-msg">Loading movers...</div>';
    section.style.display = '';

    try {
      const { mode, items } = await apiFetch(`/api/hot?era=${encodeURIComponent(era)}`);

      if (mode === 'empty') {
        section.style.display = 'none';
        return;
      }

      if (mode === 'movers') {
        title.textContent = '🔥 Hot This Week';
        el.innerHTML = items.map(item => {
          const chg  = item.pct_change;
          const cls  = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
          const sign = chg > 0 ? '+' : '';
          return `
            <div class="hot-item">
              <div class="hot-info">
                <div class="hot-product">${item.product_name}</div>
                <div class="hot-set">${item.abbreviation}</div>
              </div>
              <div class="hot-price">$${item.current_price.toFixed(2)}</div>
              <div class="badge ${cls}">${sign}${chg.toFixed(1)}%</div>
            </div>`;
        }).join('');
      } else {
        title.textContent = '💎 Most Valuable This Week';
        el.innerHTML = items.map(item => `
          <div class="hot-item">
            <div class="hot-info">
              <div class="hot-product">${item.product_name}</div>
              <div class="hot-set">${item.abbreviation}</div>
            </div>
            <div class="hot-price">$${item.current_price.toFixed(2)}</div>
          </div>`).join('');
      }
    } catch (e) {
      el.innerHTML = '<div class="inline-msg">Could not load movers.</div>';
    }
  }

  /* ── Set grid ── */
  function renderGrid(sets) {
    const grid = document.getElementById('set-grid');
    if (!sets.length) {
      grid.innerHTML = '<div class="state-msg">No sets found.</div>';
      return;
    }
    grid.innerHTML = sets.map(set => {
      const etb      = byType(set.products, 'Elite Trainer Box');
      const bb       = byType(set.products, 'Booster Box');
      const etbPrice = etb?.latest?.market_price;
      const bbPrice  = bb?.latest?.market_price;

      return `
        <div class="set-card ${selectedSet?.group_id === set.group_id ? 'active' : ''}"
             onclick="selectSet(${set.group_id})">
          <div class="card-header">
            <div class="abbrev-col">
              <span class="abbrev-pill">${set.abbreviation}</span>
              <span class="card-date">${formatDate(set.published_on)}</span>
            </div>
            <span class="card-set-name">${cleanName(set.name)}</span>
          </div>
          <div class="price-rows">
            <div class="price-row">
              <span class="pr-label">ETB</span>
              <span class="pr-val">${fmtPrice(etbPrice)}</span>
            </div>
            <div class="price-row">
              <span class="pr-label">Box</span>
              <span class="pr-val">${fmtPrice(bbPrice)}</span>
            </div>
          </div>
          <div id="spark-${set.group_id}">${sparkline([])}</div>
        </div>`;
    }).join('');
  }

  /* ── Sparkline async loader ── */
  async function loadSparklines(sets) {
    await Promise.allSettled(sets.map(async set => {
      const etb = byType(set.products, 'Elite Trainer Box');
      if (!etb) return;
      const pid = etb.product_id;
      try {
        if (!historyCache[pid]) {
          historyCache[pid] = await apiFetch(`/api/history/${pid}`);
        }
        const el = document.getElementById(`spark-${set.group_id}`);
        if (el) el.innerHTML = sparkline(historyCache[pid]);
      } catch { /* leave placeholder */ }
    }));
  }

  /* ── Set card click ── */
  function selectSet(groupId) {
    const sets = eraCache[currentEra] ?? [];
    const set = sets.find(s => s.group_id === groupId);
    if (!set) return;

    if (selectedSet?.group_id === groupId) {
      selectedSet = null;
      closeDetail();
      rerenderCards();
      return;
    }

    selectedSet = set;
    selectedType = 'Elite Trainer Box';
    rerenderCards();
    openDetail(set);
  }

  function rerenderCards() {
    const sets = eraCache[currentEra] ?? [];
    renderGrid(sets);
    loadSparklines(sets);
  }

  /* ── Detail panel ── */
  function openDetail(set) {
    const panel = document.getElementById('detail-panel');
    panel.classList.add('open');
    panel.innerHTML = buildDetailHTML(set);
    renderChart(set, selectedType);
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }

  function closeDetail() {
    const panel = document.getElementById('detail-panel');
    panel.classList.remove('open');
    panel.innerHTML = '';
    ++renderToken;
  }

  function buildDetailHTML(set) {
    const cards = TYPES.map(t => {
      const product = byType(set.products, t.db);
      const price   = product?.latest?.market_price;
      const chg     = pctChange(product?.history ?? []);
      const cls     = chg === null ? 'flat' : chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
      const chgStr  = chg === null ? '—' : `${chg > 0 ? '+' : ''}${chg.toFixed(1)}%`;

      return `
        <div class="price-card ${selectedType === t.db ? 'selected' : ''}"
             onclick="switchType('${t.db}')">
          <div class="pc-type">${t.label}</div>
          <div class="pc-price">${fmtPrice(price)}</div>
          <div class="pc-change ${cls}">${chgStr}</div>
        </div>`;
    }).join('');

    return `
      <div class="detail-header">
        <span class="detail-title">${set.name}</span>
        <button class="close-btn" onclick="closeDetailClick()">✕</button>
      </div>
      <div class="price-cards-row">${cards}</div>
      <div class="chart-container" id="price-chart"></div>`;
  }

  function closeDetailClick() {
    selectedSet = null;
    closeDetail();
    const sets = eraCache[currentEra] ?? [];
    renderGrid(sets);
    loadSparklines(sets);
  }

  async function switchType(dbType) {
    if (!selectedSet) return;
    selectedType = dbType;

    document.querySelectorAll('.price-card').forEach(c => {
      const onclick = c.getAttribute('onclick') ?? '';
      c.classList.toggle('selected', onclick.includes(`'${dbType}'`));
    });

    await renderChart(selectedSet, dbType);
  }

  /* ── Plotly chart ── */
  async function renderChart(set, dbType) {
    const token = ++renderToken;
    const chartEl = document.getElementById('price-chart');
    if (!chartEl) return;

    const product = byType(set.products, dbType);
    if (!product) {
      chartEl.innerHTML =
        '<div class="state-msg" style="padding:60px 0">No data for this product type.</div>';
      return;
    }

    const pid = product.product_id;
    if (!historyCache[pid]) {
      chartEl.innerHTML =
        '<div class="state-msg" style="padding:60px 0">Loading chart...</div>';
      try {
        historyCache[pid] = await apiFetch(`/api/history/${pid}`);
      } catch {
        if (token !== renderToken) return;
        chartEl.innerHTML =
          '<div class="state-msg" style="padding:60px 0">Failed to load chart data.</div>';
        return;
      }
    }

    if (token !== renderToken) return;

    const history = historyCache[pid];
    const dates   = history.map(h => h.captured_at);
    const prices  = history.map(h => h.market_price);

    chartEl.innerHTML = '';

    Plotly.newPlot(chartEl, [{
      x: dates,
      y: prices,
      type: 'scatter',
      mode: 'lines+markers',
      line:      { color: '#6c63ff', width: 2.5 },
      marker:    { color: '#6c63ff', size: 7 },
      fill:      'tozeroy',
      fillcolor: 'rgba(108,99,255,0.07)',
      hovertemplate: '<b>%{x}</b><br>$%{y:.2f}<extra></extra>',
    }], {
      paper_bgcolor: 'transparent',
      plot_bgcolor:  'transparent',
      font: { color: '#888899', family: 'Inter, sans-serif', size: 12 },
      xaxis: {
        gridcolor: 'rgba(255,255,255,0.05)',
        linecolor: 'rgba(255,255,255,0.05)',
        tickcolor: 'rgba(255,255,255,0.05)',
        zeroline:  false,
      },
      yaxis: {
        gridcolor:  'rgba(255,255,255,0.05)',
        linecolor:  'rgba(255,255,255,0.05)',
        tickcolor:  'rgba(255,255,255,0.05)',
        tickprefix: '$',
        zeroline:   false,
      },
      margin: { t: 12, r: 16, b: 48, l: 64 },
      showlegend: false,
    }, {
      responsive:     true,
      displayModeBar: false,
    });
  }

  /* ── Sparkline (SVG) ── */
  function sparkline(history) {
    const W = 160, H = 40, pad = 4;
    const prices = history.map(h => h.market_price).filter(p => p != null);

    if (prices.length < 2) {
      return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}"
              stroke="rgba(0,200,150,0.28)" stroke-width="1.5" stroke-dasharray="4"/>
      </svg>`;
    }

    const lo = Math.min(...prices), hi = Math.max(...prices);
    const range = hi - lo || 1;
    const pts = prices.map((p, i) => {
      const x = pad + (i / (prices.length - 1)) * (W - 2 * pad);
      const y = H - pad - ((p - lo) / range) * (H - 2 * pad);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const color = prices[prices.length - 1] >= prices[0] ? 'var(--green)' : 'var(--red)';
    return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none"
                stroke="${color}" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  /* ── Helpers ── */
  function byType(products, dbType) {
    return products?.find(p => p.product_type === dbType) ?? null;
  }

  function pctChange(history) {
    const prices = history.map(h => h.market_price).filter(p => p != null);
    if (prices.length < 2) return null;
    const prev = prices[prices.length - 2];
    const cur  = prices[prices.length - 1];
    return prev ? ((cur - prev) / prev) * 100 : null;
  }

  function fmtPrice(val) {
    return val != null ? `$${val.toFixed(2)}` : '—';
  }

  function cleanName(name) {
    return name.replace(/^[A-Z0-9]+:\s*/, '');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [year, month] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(month, 10) - 1]} ${year}`;
  }

  async function apiFetch(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
</script>
</body>
